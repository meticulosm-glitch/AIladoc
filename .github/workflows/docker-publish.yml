name: Build and Push Docker Image

on:
  push:
    tags:
      - '*'

env:
  IMAGE_NAME: meticulo/ailadoc

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Senza image.tag nei values il chart usa appVersion: se non è un tag pubblicato il pod
      # va in ErrImagePull. Avviso (non blocca la pubblicazione dell'immagine).
      - name: Check chart appVersion
        run: |
          app_version=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/ailadoc/Chart.yaml)
          if [ "$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::warning file=charts/ailadoc/Chart.yaml::appVersion è '$app_version' ma il tag è '$GITHUB_REF_NAME': aggiorna appVersion, altrimenti il chart usa un'immagine diversa (o inesistente)."
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
