# Valori di default per il chart AIladoc.

image:
  # Immagine costruita da docker/Dockerfile e pubblicata su Docker Hub dal workflow
  # .github/workflows/docker-publish.yml (tag = tag git)
  repository: meticulo/ailadoc
  # Default: appVersion del Chart
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Con SQLite e un volume ReadWriteOnce deve restare 1 (vedi README del chart).
replicaCount: 1

# ---------------------------------------------------------------------------
# Argo Rollouts: con enabled: true il chart crea un Rollout (argoproj.io/v1alpha1)
# al posto del Deployment. Servono il controller e le CRD di Argo Rollouts nel cluster.
# enabled: false = Deployment classico.
rollout:
  enabled: true
  # canary | blueGreen
  strategy: canary
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  # Annulla il rollout (torna alla versione stabile) se supera progressDeadlineSeconds
  progressDeadlineAbort: false
  annotations: {}
  canary:
    # Con volume ReadWriteOnce il chart usa sempre maxSurge 0 / maxUnavailable 1 (il vecchio
    # pod si ferma prima che parta il nuovo, come Recreate) e ignora questi due valori.
    maxSurge: "25%"
    maxUnavailable: 0
    # Passi del rollout ([] = promozione immediata). Con 1 replica il canary è "tutto o niente":
    # il nuovo pod sostituisce il vecchio e la pausa è la finestra in cui osservarlo e,
    # se serve, fare "kubectl argo rollouts abort" per tornare alla versione stabile.
    steps:
      - setWeight: 100
      - pause: {duration: 2m}
    # Esempio con più repliche (volume ReadWriteMany + Postgres):
    #   - setWeight: 20
    #   - pause: {}              # attende "kubectl argo rollouts promote"
    #   - setWeight: 50
    #   - pause: {duration: 5m}
    # Analisi in background con AnalysisTemplate esistenti, es.:
    #   analysis:
    #     templates: [{templateName: ailadoc-success-rate}]
    #     startingStep: 1
    analysis: {}
    trafficRouting:
      # Suddivide il traffico con ingress-nginx: crea il Service <nome>-canary e Argo genera
      # l'ingress canary. Richiede ingress.enabled e un volume ReadWriteMany.
      nginx:
        enabled: false
        additionalIngressAnnotations: {}
  # Richiede un volume ReadWriteMany (o persistence.enabled: false): vecchia e nuova versione
  # restano attive insieme.
  blueGreen:
    autoPromotionEnabled: true
    # Promozione automatica dopo N secondi (0 = subito, se autoPromotionEnabled)
    autoPromotionSeconds: 0
    scaleDownDelaySeconds: 30
    # Service <nome>-preview verso la nuova versione prima della promozione
    previewService:
      enabled: true
    prePromotionAnalysis: {}
    postPromotionAnalysis: {}

app:
  name: AIladoc
  companyName: ""
  # URL pubblico dell'app. Se vuoto viene ricavato dal primo host dell'ingress
  # (https se l'ingress ha TLS).
  baseUrl: ""
  maxUploadMb: 100
  sessionMaxAgeSeconds: 28800
  # Anteprima PowerPoint/Word via LibreOffice (richiede l'immagine con OFFICE_PREVIEW=true)
  officePreview: true
  officePreviewTimeoutSeconds: 120
  # Copia i documenti di esempio al primo avvio se il volume è vuoto
  seedSampleDocs: false
  # Ruoli Keycloak:
  #  - adminRoles sono SEMPRE amministratori (anti lock-out)
  #  - editorRoles/viewerRoles creano i ruoli app iniziali al primo avvio;
  #    poi si gestiscono da Amministrazione -> Ruoli app
  adminRoles: [ailadoc-admin]
  editorRoles: [ailadoc-editor]
  viewerRoles: [ailadoc-viewer]

# ---------------------------------------------------------------------------
# Keycloak esterno. url/internalUrl/realm/clientId/clientSecret finiscono nel
# Secret dell'app (sono le stringhe di connessione), il resto nella ConfigMap.
keycloak:
  # URL raggiunto dal browser, senza /realms/... DA CAMBIARE con il vostro Keycloak.
  url: https://sso.example.com
  # URL raggiunto dal pod, se diverso (es. http://keycloak.keycloak.svc:8080).
  # Keycloak deve allora avere KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true.
  internalUrl: ""
  realm: ailadoc
  clientId: ailadoc
  # Vuoto = client pubblico (si usa comunque PKCE)
  clientSecret: ""
  scopes: "openid profile email"
  # Claim aggiuntivi da cui leggere ruoli/gruppi
  rolesExtraClaims: [roles, groups]
  verifyTls: true
  # CA interna per il certificato di Keycloak: ConfigMap o Secret esistente con un PEM
  caBundle:
    configMapName: ""
    secretName: ""
    key: ca.crt

# ---------------------------------------------------------------------------
# Pagina di login
login:
  # form: pagina dell'app, credenziali verificate da Keycloak lato server
  #       (sul client Keycloak serve "Direct access grants")
  # redirect: pagina di login di Keycloak
  mode: form
  # Aggiunge "Accedi con Single Sign-On" (pagina di Keycloak)
  ssoButton: false
  # Campo "Codice di verifica" per chi ha l'OTP attivo
  otp: false
  # "" = nascosto, "keycloak" = reset del realm, oppure un URL
  passwordResetUrl: ""
  # Tentativi falliti in 10 minuti per utente e IP
  maxAttempts: 10

# ---------------------------------------------------------------------------
# Utenti locali: accedono con nome utente e password senza passare da Keycloak
# (es. amministratore d'emergenza se Keycloak non risponde). Le password le genera
# casualmente un Job (hook pre-install/pre-upgrade, PreSync con Argo CD) nel Secret
# <nome>-local-users, una chiave per utente; i nuovi utenti ricevono una password,
# quelli esistenti la mantengono, quelli tolti da qui vengono rimossi. Per leggerla:
#   kubectl -n <ns> get secret <nome>-local-users -o jsonpath='{.data.admin}' | base64 -d
localUsers:
  enabled: true
  # Nome (minuscole, cifre, . _ -) e ruoli, come se arrivassero da Keycloak.
  # Si può scrivere anche solo il nome: riceve defaultRoles.
  users:
    - name: admin
      roles: [ailadoc-admin]
  #  - mario
  defaultRoles: [ailadoc-viewer]
  passwordLength: 24
  job:
    # vuoto = immagine dell'app (il Job usa solo Python)
    image:
      repository: ""
      tag: ""
    backoffLimit: 3
    activeDeadlineSeconds: 300
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# ---------------------------------------------------------------------------
# Controllo password e credenziali scritte nei documenti
secretsScan:
  enabled: true
  # warn: salva ma avvisa e chiede conferma | block: rifiuta finché non vengono tolte
  policy: warn
  rescanSeconds: 30

# ---------------------------------------------------------------------------
# Assistente AIla. baseUrl e apiKey vanno nel Secret.
assistant:
  enabled: true
  name: AIla
  # Domande d'esempio nel pannello
  suggestions: []
  # none (solo ricerca, nessun dato esce dal cluster) | anthropic | openai (API compatibili OpenAI)
  llm: none
  # Default per anthropic: claude-haiku-5-5. Obbligatorio per openai.
  model: ""
  # Endpoint del modello, es. http://ollama.ai.svc:11434/v1 (vuoto = default del provider)
  baseUrl: ""
  apiKey: ""
  ratePerMinute: 20
  timeoutSeconds: 60

# ---------------------------------------------------------------------------
# Plugin delle pagine: macro di formattazione, tabelle dinamiche, diagrammi draw.io
plugins:
  # [all] oppure un elenco tra: drawio, tables, macros
  enabled: [all]
  # Editor draw.io incorporato. Gira nel browser: i diagrammi non vengono caricati sui server di draw.io.
  # Per non dipendere da Internet: un'istanza jgraph/drawio nel cluster (es. https://drawio.example.com).
  # "" = i diagrammi si vedono ma non si modificano dal browser.
  drawioEditorUrl: https://embed.diagrams.net
  # Siti ammessi nella macro "embed" (vuoto = elenco predefinito: Figma, Miro, Google, Microsoft 365, YouTube...)
  embedAllowedHosts: []

# ---------------------------------------------------------------------------
# Metriche Prometheus su GET /metrics (porta http del pod)
metrics:
  enabled: true
  # Token Bearer richiesto da /metrics (va nel Secret come METRICS_TOKEN). Consigliato: l'ingress
  # pubblica tutta l'app, /metrics compreso. Vuoto = endpoint aperto.
  token: ""
  # Con secrets.existingSecret: true se quel Secret contiene METRICS_TOKEN (lo usa il ServiceMonitor)
  existingSecretHasToken: false
  # Annotazioni prometheus.io/scrape|port|path sul pod (scrape "classico" senza Prometheus Operator;
  # non passano il token: usale con token vuoto e /metrics non esposto pubblicamente)
  scrapeAnnotations: false
  # ServiceMonitor per Prometheus Operator / kube-prometheus-stack (richiede le sue CRD)
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # etichette richieste dal selettore del vostro Prometheus (es. release: kube-prometheus-stack)
    labels: {}

# ---------------------------------------------------------------------------
# Secret dell'app (stringhe di connessione e credenziali).
secrets:
  # Secret gestito da voi (Sealed Secrets, External Secrets, Vault...). Se impostato,
  # il chart NON crea il suo Secret e ignora keycloak.url/internalUrl/realm/clientId/
  # clientSecret, assistant.baseUrl/apiKey e i valori qui sotto. Chiavi lette:
  #   SECRET_KEY            (facoltativa) firma dei cookie; se manca la genera l'app nel volume
  #   KEYCLOAK_PUBLIC_URL   (obbligatoria) es. https://sso.example.com
  #   KEYCLOAK_REALM        (obbligatoria)
  #   OIDC_CLIENT_ID        (obbligatoria)
  #   OIDC_CLIENT_SECRET    (se il client è confidenziale)
  #   KEYCLOAK_INTERNAL_URL (facoltativa)
  #   DATABASE_URL          (facoltativa, es. postgresql+psycopg://user:pass@host/db)
  #   ASSISTANT_BASE_URL    (facoltativa)
  #   ASSISTANT_API_KEY     (facoltativa)
  #   METRICS_TOKEN         (facoltativa, vedi metrics.existingSecretHasToken)
  existingSecret: ""
  # Firma dei cookie di sessione. Vuota = l'app la genera al primo avvio e la salva nel volume
  # dati (/data/.secret_key): resta la stessa tra riavvii e sync di Argo CD.
  secretKey: ""
  # Facoltativo, es. postgresql+psycopg://user:pass@host/db (richiede psycopg nell'immagine)
  databaseUrl: ""

# ---------------------------------------------------------------------------
# Vault tramite External Secrets Operator (servono il controller e le sue CRD).
# Con vault.address (oppure existingStore.name) il chart crea un SecretStore e un
# ExternalSecret che scrive le chiavi di vault.keys nel Secret <nome>-vault, letto dal pod
# dopo quello del chart (ha la precedenza). Senza Vault quelle chiavi finiscono nel Secret
# del chart con il valore dei values (keycloak.clientSecret, assistant.apiKey, metrics.token...)
# oppure, se vuoto, con il segnaposto "Changeme". Eccezioni: SECRET_KEY (la genera l'app)
# e DATABASE_URL (senza valore si usa SQLite) non ricevono mai il segnaposto.
# Le modifiche in Vault aggiornano il Secret ma non riavviano il pod (usate ad es. Reloader).
vault:
  # es. https://vault.example.com:8200 (vuoto = Vault non configurato)
  address: ""
  # Namespace di Vault Enterprise
  namespace: ""
  # Motore KV: mount e versione (v1 | v2)
  mountPath: secret
  kvVersion: v2
  # Percorso del segreto nel mount (es. ailadoc/prod)
  secretPath: ailadoc
  # Chiave del Secret dell'app -> proprietà del segreto in Vault
  keys:
    OIDC_CLIENT_SECRET: oidc-client-secret
    # SECRET_KEY: secret-key
    # DATABASE_URL: database-url
    # ASSISTANT_API_KEY: assistant-api-key
    # ASSISTANT_BASE_URL: assistant-base-url
    # METRICS_TOKEN: metrics-token
  refreshInterval: 1h
  auth:
    # kubernetes | token | appRole
    method: kubernetes
    kubernetes:
      mountPath: kubernetes
      # ruolo Vault legato al service account del chart e al namespace
      role: ailadoc
      # vuoto = service account del chart
      serviceAccount: ""
    token:
      secretName: ""
      key: token
    appRole:
      path: approle
      roleId: ""
      secretName: ""
      key: secret-id
  # CA del certificato di Vault: ConfigMap o Secret esistente
  caProvider:
    type: ""   # ConfigMap | Secret
    name: ""
    key: ca.crt
  # SecretStore o ClusterSecretStore già esistente: il chart non crea il proprio
  existingStore:
    name: ""
    kind: ClusterSecretStore
  apiVersion: external-secrets.io/v1

persistence:
  enabled: true
  # PVC esistente da usare al posto di quella creata dal chart
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
  annotations: {}

# Loghi da una ConfigMap (chiavi: app-logo.svg|png, company-logo.svg|png).
# Se impostata, i loghi sono in sola lettura e non si cambiano dalla UI.
# In alternativa caricali da Amministrazione -> Loghi (finiscono nel volume).
branding:
  configMapName: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations:
    # upload fino a app.maxUploadMb (ingress-nginx)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: docs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: docs-example-com-tls
  #    hosts: [docs.example.com]

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# /tmp scrivibile (LibreOffice, upload temporanei)
tmpVolume:
  sizeLimit: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # LibreOffice può usare parecchia memoria su presentazioni grandi
    memory: 1Gi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20
    failureThreshold: 3

# Variabili d'ambiente aggiuntive
extraEnv: []
#  - name: LOG_LEVEL
#    value: debug
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
