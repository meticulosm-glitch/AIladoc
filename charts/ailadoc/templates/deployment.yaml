{{- $rwo := has "ReadWriteOnce" .Values.persistence.accessModes -}}
{{- if and (gt (int .Values.replicaCount) 1) .Values.persistence.enabled $rwo }}
{{- fail "replicaCount > 1 richiede un volume ReadWriteMany (persistence.accessModes) e databaseUrl verso Postgres: con SQLite su ReadWriteOnce usa 1 replica." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ailadoc.fullname" . }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if and .Values.persistence.enabled $rwo }}
    # il volume RWO non può essere montato da due pod insieme
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "ailadoc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret-values: {{ list .Values.keycloak .Values.assistant.baseUrl .Values.assistant.apiKey .Values.secrets | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ailadoc.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ailadoc.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ailadoc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ailadoc.fullname" . }}
            - secretRef:
                name: {{ include "ailadoc.secretName" . }}
          env:
            - name: DATA_DIR
              value: /data
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.branding.configMapName }}
            - name: branding
              mountPath: /data/branding
              readOnly: true
            {{- end }}
            {{- if include "ailadoc.caMounted" . }}
            - name: keycloak-ca
              mountPath: /etc/ailadoc/ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ailadoc.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        {{- if .Values.branding.configMapName }}
        - name: branding
          configMap:
            name: {{ .Values.branding.configMapName }}
        {{- end }}
        {{- if .Values.keycloak.caBundle.configMapName }}
        - name: keycloak-ca
          configMap:
            name: {{ .Values.keycloak.caBundle.configMapName }}
        {{- else if .Values.keycloak.caBundle.secretName }}
        - name: keycloak-ca
          secret:
            secretName: {{ .Values.keycloak.caBundle.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
