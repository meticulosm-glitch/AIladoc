{{- if not .Values.rollout.enabled }}
{{- include "ailadoc.validateReplicas" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ailadoc.fullname" . }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if include "ailadoc.rwo" . }}
    # il volume RWO non può essere montato da due pod insieme
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "ailadoc.selectorLabels" . | nindent 6 }}
  template:
    {{- include "ailadoc.podTemplate" . | nindent 4 }}
{{- end }}
