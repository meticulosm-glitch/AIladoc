{{- $users := include "ailadoc.localUsersJson" . -}}
{{- if $users }}
{{- $name := printf "%s-local-users" (include "ailadoc.fullname" .) -}}
{{- $job := .Values.localUsers.job -}}
{{- /* Hook pre-install/pre-upgrade (PreSync con Argo CD): il Secret con le password esiste
       prima che parta il pod. Il Secret lo crea il Job, non Helm/Argo CD: non viene mai
       sovrascritto né rimosso da un sync, e le password restano le stesse. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  # solo il Secret delle password (create non si può limitare per nome)
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $name }}]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $job.backoffLimit }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ailadoc.name" . }}
        app.kubernetes.io/component: local-users-job
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: passwords
          image: "{{ $job.image.repository | default .Values.image.repository }}:{{ $job.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: [python, -I, -c]
          args:
            - |
              {{- .Files.Get "files/local-users-job.py" | nindent 14 }}
          env:
            - name: SECRET_NAME
              value: {{ $name }}
            - name: LOCAL_USERS
              value: {{ $users | quote }}
            - name: PASSWORD_LENGTH
              value: {{ .Values.localUsers.passwordLength | quote }}
            - name: SECRET_LABELS
              # niente app.kubernetes.io/instance: Argo CD lo considererebbe suo e lo eliminerebbe (prune)
              value: {{ dict "app.kubernetes.io/name" (include "ailadoc.name" .) "app.kubernetes.io/component" "local-users" | toJson | quote }}
          resources:
            {{- toYaml $job.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
