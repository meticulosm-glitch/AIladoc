{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $withToken := ternary .Values.metrics.existingSecretHasToken (not (empty .Values.metrics.token)) (not (empty .Values.secrets.existingSecret)) -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ailadoc.fullname" . }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ailadoc.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- if $withToken }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "ailadoc.secretName" . }}
          key: METRICS_TOKEN
      {{- end }}
{{- end }}
