{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $tokenSecret := include "ailadoc.metricsTokenSecret" . -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ailadoc.fullname" . }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ailadoc.selectorLabels" . | nindent 6 }}
    # esclude i Service canary/preview di Argo Rollouts (metriche duplicate)
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [canary, preview]
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- with $tokenSecret }}
      authorization:
        type: Bearer
        credentials:
          name: {{ . }}
          key: METRICS_TOKEN
      {{- end }}
{{- end }}
