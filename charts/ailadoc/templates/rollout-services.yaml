{{- /*
Service aggiuntivi per Argo Rollouts. Il controller aggiunge al selettore
rollouts-pod-template-hash, così ognuno punta solo ai pod della sua versione.
*/ -}}
{{- if .Values.rollout.enabled }}
{{- $r := .Values.rollout -}}
{{- $roles := list -}}
{{- if and (eq $r.strategy "canary") $r.canary.trafficRouting.nginx.enabled }}
{{- $roles = append $roles "canary" -}}
{{- end }}
{{- if and (eq $r.strategy "blueGreen") $r.blueGreen.previewService.enabled }}
{{- $roles = append $roles "preview" -}}
{{- end }}
{{- range $roles }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ailadoc.fullname" $ }}-{{ . }}
  labels:
    {{- include "ailadoc.labels" $ | nindent 4 }}
    # esclusi dal ServiceMonitor: punterebbero agli stessi pod del Service principale
    app.kubernetes.io/component: {{ . }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ailadoc.selectorLabels" $ | nindent 4 }}
{{- end }}
{{- end }}
