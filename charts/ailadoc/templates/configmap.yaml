{{- $baseUrl := include "ailadoc.baseUrl" . -}}
# Configurazione non sensibile. Le stringhe di connessione (Keycloak, database,
# endpoint e chiave del modello) e le credenziali stanno nel Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ailadoc.fullname" . }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  COMPANY_NAME: {{ .Values.app.companyName | quote }}
  BASE_URL: {{ $baseUrl | quote }}
  COOKIE_SECURE: {{ hasPrefix "https://" $baseUrl | toString | quote }}
  SESSION_MAX_AGE: {{ .Values.app.sessionMaxAgeSeconds | toString | quote }}
  MAX_UPLOAD_MB: {{ .Values.app.maxUploadMb | toString | quote }}
  OFFICE_PREVIEW: {{ .Values.app.officePreview | toString | quote }}
  OFFICE_PREVIEW_TIMEOUT: {{ .Values.app.officePreviewTimeoutSeconds | toString | quote }}
  SEED_SAMPLE_DOCS: {{ .Values.app.seedSampleDocs | toString | quote }}
  ADMIN_ROLES: {{ join "," .Values.app.adminRoles | quote }}
  EDITOR_ROLES: {{ join "," .Values.app.editorRoles | quote }}
  VIEWER_ROLES: {{ join "," .Values.app.viewerRoles | quote }}
  OIDC_SCOPES: {{ .Values.keycloak.scopes | quote }}
  ROLES_EXTRA_CLAIMS: {{ join "," .Values.keycloak.rolesExtraClaims | quote }}
  OIDC_VERIFY_TLS: {{ .Values.keycloak.verifyTls | toString | quote }}
  {{- if include "ailadoc.caMounted" . }}
  OIDC_CA_FILE: "/etc/ailadoc/ca/{{ .Values.keycloak.caBundle.key }}"
  {{- end }}
  SECRETS_SCAN: {{ .Values.secretsScan.enabled | toString | quote }}
  SECRETS_POLICY: {{ .Values.secretsScan.policy | quote }}
  SECRETS_RESCAN_SECONDS: {{ .Values.secretsScan.rescanSeconds | toString | quote }}
  ASSISTANT_ENABLED: {{ .Values.assistant.enabled | toString | quote }}
  ASSISTANT_NAME: {{ .Values.assistant.name | quote }}
  ASSISTANT_SUGGESTIONS: {{ join "|" .Values.assistant.suggestions | quote }}
  ASSISTANT_LLM: {{ .Values.assistant.llm | quote }}
  ASSISTANT_MODEL: {{ .Values.assistant.model | quote }}
  ASSISTANT_RATE_PER_MINUTE: {{ .Values.assistant.ratePerMinute | toString | quote }}
  ASSISTANT_TIMEOUT: {{ .Values.assistant.timeoutSeconds | toString | quote }}
  PLUGINS: {{ join "," .Values.plugins.enabled | quote }}
  DRAWIO_EDITOR_URL: {{ .Values.plugins.drawioEditorUrl | quote }}
  {{- with .Values.plugins.embedAllowedHosts }}
  EMBED_ALLOWED_HOSTS: {{ join "," . | quote }}
  {{- end }}
  AUTH_DEV_MODE: "false"
