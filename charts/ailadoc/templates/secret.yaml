{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.keycloak.url }}
{{- fail "keycloak.url è obbligatorio (es. https://sso.example.com), oppure usa secrets.existingSecret" }}
{{- end }}
{{- $name := include "ailadoc.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secretKey := .Values.secrets.secretKey -}}
{{- if and (not $secretKey) $existing $existing.data -}}
{{- $secretKey = index $existing.data "SECRET_KEY" | default "" | b64dec -}}
{{- end -}}
{{- if not $secretKey -}}
{{- $secretKey = randAlphaNum 64 -}}
{{- end }}
# Stringhe di connessione e credenziali dell'app.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
  annotations:
    # mantiene la chiave di sessione anche se il chart viene disinstallato
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  KEYCLOAK_PUBLIC_URL: {{ .Values.keycloak.url | trimSuffix "/" | quote }}
  KEYCLOAK_INTERNAL_URL: {{ .Values.keycloak.internalUrl | trimSuffix "/" | quote }}
  KEYCLOAK_REALM: {{ required "keycloak.realm è obbligatorio" .Values.keycloak.realm | quote }}
  OIDC_CLIENT_ID: {{ required "keycloak.clientId è obbligatorio" .Values.keycloak.clientId | quote }}
  {{- with .Values.keycloak.clientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.assistant.baseUrl }}
  ASSISTANT_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.assistant.apiKey }}
  ASSISTANT_API_KEY: {{ . | quote }}
  {{- end }}
data:
  SECRET_KEY: {{ $secretKey | b64enc | quote }}
{{- end }}
