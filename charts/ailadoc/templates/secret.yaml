{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.keycloak.url }}
{{- fail "keycloak.url non può essere vuoto (es. https://sso.example.com), oppure usa secrets.existingSecret" }}
{{- end }}
{{- $name := include "ailadoc.fullname" . -}}
{{- $vault := include "ailadoc.vaultEnabled" . -}}
{{- $vaultKeys := .Values.vault.keys | default dict -}}
{{- $secretKey := .Values.secrets.secretKey -}}
{{- if not $secretKey -}}
{{- /* installazioni Helm precedenti: mantiene la chiave già salvata nel Secret.
       Con helm template / Argo CD lookup è vuoto: la chiave la genera l'app e la salva nel volume. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data -}}
{{- $secretKey = index $existing.data "SECRET_KEY" | default "" | b64dec -}}
{{- end -}}
{{- end }}
{{- /* credenziali: valore dai values; se manca e la chiave è tra vault.keys, segnaposto
       "Changeme" finché Vault non è configurato. Con Vault queste chiavi le scrive l'ExternalSecret. */ -}}
{{- $creds := dict
      "OIDC_CLIENT_SECRET" .Values.keycloak.clientSecret
      "DATABASE_URL" .Values.secrets.databaseUrl
      "ASSISTANT_BASE_URL" .Values.assistant.baseUrl
      "ASSISTANT_API_KEY" .Values.assistant.apiKey
      "METRICS_TOKEN" .Values.metrics.token -}}
{{- /* niente segnaposto per DATABASE_URL (l'app non partirebbe) */ -}}
{{- $noPlaceholder := list "DATABASE_URL" -}}
# Stringhe di connessione e credenziali dell'app.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ailadoc.labels" . | nindent 4 }}
  annotations:
    # mantiene le credenziali anche se il chart viene disinstallato
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  KEYCLOAK_PUBLIC_URL: {{ .Values.keycloak.url | trimSuffix "/" | quote }}
  KEYCLOAK_INTERNAL_URL: {{ .Values.keycloak.internalUrl | trimSuffix "/" | quote }}
  KEYCLOAK_REALM: {{ required "keycloak.realm è obbligatorio" .Values.keycloak.realm | quote }}
  OIDC_CLIENT_ID: {{ required "keycloak.clientId è obbligatorio" .Values.keycloak.clientId | quote }}
  {{- if not (and $vault (hasKey $vaultKeys "SECRET_KEY")) }}
  {{- with $secretKey }}
  SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- range $key := keys $creds | sortAlpha }}
  {{- $value := get $creds $key }}
  {{- if and $vault (hasKey $vaultKeys $key) }}
  {{- else if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- else if and (hasKey $vaultKeys $key) (not (has $key $noPlaceholder)) }}
  {{ $key }}: "Changeme"  # segnaposto: configura vault.* (o il valore nei values)
  {{- end }}
  {{- end }}
{{- end }}
